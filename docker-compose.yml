services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/recreation.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - PISTON_API_URL=http://piston:2000
    volumes:
      - sqlite_data:/app/data
    depends_on:
      piston:
        condition: service_started
      piston-init:
        condition: service_completed_successfully

  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    environment:
      - PISTON_RUN_TIMEOUT=10000
      - PISTON_COMPILE_TIMEOUT=10000
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

  piston-init:
    image: curlimages/curl:latest
    depends_on:
      - piston
    command: >
      sh -c "
      echo 'Waiting for Piston API...' &&
      sleep 5 &&
      curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\": \"python\", \"version\": \"3.10.0\"}' &&
      echo 'Python installed'
      "

volumes:
  sqlite_data:
  piston_packages:
